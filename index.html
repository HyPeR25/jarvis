  (function() {
    const iconUrl = new URL('./jarvis.ico', window.location.href).href;
    const manifest = {
      name: "J.A.R.V.I.S. 3D Anatomy & Split",
      short_name: "J.A.R.V.I.S.",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#07080b",
      theme_color: "#07080b",
      orientation: "portrait-primary",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/x-icon", purpose: "any maskable" },
        { src: iconUrl, sizes: "512x512", type: "image/x-icon", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();
</script>

<script>
// ============================================================================
// 0. FIREBASE CLOUD AUTO-SYNC (Preserved & Unified)
// ============================================================================
const DB_URL = "https://jarvis-sync-37fef-default-rtdb.asia-southeast1.firebasedatabase.app/jarvis_state.json";

async function pullCloudSync() {
  const dot = document.getElementById('sync-dot');
  try {
    const res = await fetch(DB_URL);
    const cloudData = await res.json();
    if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-500";
    if (cloudData && cloudData.updatedAt > (Number(localStorage.getItem("jarvis_updated")) || 0)) {
      Object.keys(cloudData.storage || {}).forEach(k => localStorage.setItem(k, cloudData.storage[k]));
      localStorage.setItem("jarvis_updated", cloudData.updatedAt);
      location.reload();
    }
  } catch (e) {
    if (dot) dot.className = "w-2 h-2 rounded-full bg-amber-400";
  }
}

const _origSetItem = localStorage.setItem.bind(localStorage);
localStorage.setItem = function(key, val) {
  _origSetItem(key, val);
  if (key === "jarvis_updated") return;
  const now = Date.now();
  _origSetItem("jarvis_updated", now);
  const snapshot = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k !== "jarvis_updated") snapshot[k] = localStorage.getItem(k);
  }
  fetch(DB_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ updatedAt: now, storage: snapshot })
  }).catch(() => {});
};

// Offline Service Worker Cache for GitHub Pages (HTTPS)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const swCode = `
    const CACHE = 'jarvis-pwa-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html', './jarvis.ico']).catch(() => {})));
    });
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET' || e.request.url.includes('firebasedatabase.app')) return;
      e.respondWith(
        fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone)).catch(() => {});
          return res;
        }).catch(() => caches.match(e.request))
      );
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
}

// ============================================================================
// 1. ANATOMICAL MUSCLE DEFINITIONS & LOCKED-IN 6-DAY V-TAPER / ARMS SPLIT
// ============================================================================
const MUSCLE_INFO = {
  chest:       { short: 'Chest',       latin: 'Pectoralis Major (Sternal)' },
  upper_chest: { short: 'Upper Chest', latin: 'Pectoralis Major (Clavicular)' },

  el.classList.remove('opacity-0');
  clearTimeout(toastTimer);

// Rest Countdown Timer
let restInterval = null;
let restRemaining = 0;

function startRestTimer(seconds = 90) {
  const bar = document.getElementById('rest-timer-bar');
  const display = document.getElementById('rest-timer-display');
  if (!bar || !display) return;
  clearInterval(restInterval);
  restRemaining = seconds;
  bar.classList.remove('hidden');
  const renderTime = () => {
    const m = String(Math.floor(restRemaining / 60)).padStart(2, '0');
    const s = String(restRemaining % 60).padStart(2, '0');
    display.textContent = `${m}:${s}`;
  };
  renderTime();
  restInterval = setInterval(() => {
    restRemaining -= 1;
    if (restRemaining <= 0) {
      clearInterval(restInterval);
      bar.classList.add('hidden');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      showToast('Rest complete — hit your next set!');
    } else {
      renderTime();
    }
  }, 1000);
}

function stopRestTimer() {
  clearInterval(restInterval);
  const bar = document.getElementById('rest-timer-bar');
  if (bar) bar.classList.add('hidden');
}

document.querySelectorAll('.rest-preset-btn').forEach(btn => {
  btn.addEventListener('click', () => startRestTimer(Number(btn.dataset.sec) || 90));
});
document.getElementById('btn-stop-timer').addEventListener('click', stopRestTimer);

const DEFAULT_GLB_NAME = '2284_gerard_corentin_-_ecorche_-_anatomy.glb';
const IDB_NAME = 'jarvis_ecorche_db';
const IDB_STORE = 'models';

function openModelDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB_STORE)) {
        req.result.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveGlbToCache(name, arrayBuffer) {
  try {
    const db = await openModelDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ name, buffer: arrayBuffer }, 'primary_ecorche');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {}
}

async function getCachedGlb() {
  try {
    const db = await openModelDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('primary_ecorche');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return null;
  }
}

let loadedGlbGroup = null;
let gltfLoaderReady = null;
const MUSCLE_KEYS = Object.keys(MUSCLE_INFO);
const glbUniforms = {
  uPrimaryMask: { value: new Float32Array(14) },
  uSecondaryMask: { value: new Float32Array(14) },
  uTime: { value: 0 }
};

function ensureGLTFLoader() {
  if (window.THREE && THREE.GLTFLoader) return Promise.resolve();
  if (gltfLoaderReady) return gltfLoaderReady;
  gltfLoaderReady = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('GLTFLoader failed'));
    document.head.appendChild(script);
  });
  return gltfLoaderReady;
}

async function mountGlbBuffer(arrayBuffer, fileName, silent = false) {
  await ensureGLTFLoader();
  const loader = new THREE.GLTFLoader();
  loader.parse(arrayBuffer, '', (gltf) => {
    if (loadedGlbGroup) scene.remove(loadedGlbGroup);
    loadedGlbGroup = gltf.scene;

    const box = new THREE.Box3().setFromObject(loadedGlbGroup);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scale = 1.78 / Math.max(size.y, 0.001);
    loadedGlbGroup.scale.setScalar(scale);

    const sBox = new THREE.Box3().setFromObject(loadedGlbGroup);
    const sCenter = new THREE.Vector3();
    sBox.getCenter(sCenter);
    loadedGlbGroup.position.set(-sCenter.x, -sBox.min.y, -sCenter.z);

    loadedGlbGroup.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.vertexColors = true;
        child.material.roughness = 0.45;
        child.material.onBeforeCompile = (shader) => {
          shader.uniforms.uPrimaryMask = glbUniforms.uPrimaryMask;
          shader.uniforms.uSecondaryMask = glbUniforms.uSecondaryMask;
          shader.uniforms.uTime = glbUniforms.uTime;
          shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
            .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>', `
              #include <common>
              varying vec3 vWPos;
              uniform float uPrimaryMask[14];
              uniform float uSecondaryMask[14];
              uniform float uTime;
              float mWeight(int i, vec3 p) {
                float y = p.y; float ax = abs(p.x); float z = p.z;
                if (i==0) return smoothstep(1.16,1.21,y)*(1.0-smoothstep(1.33,1.38,y))*(1.0-smoothstep(0.15,0.21,ax))*smoothstep(0.02,0.07,z);
                if (i==1) return smoothstep(1.32,1.36,y)*(1.0-smoothstep(1.44,1.48,y))*(1.0-smoothstep(0.16,0.22,ax))*smoothstep(0.02,0.07,z);
                if (i==2) return smoothstep(1.04,1.12,y)*(1.0-smoothstep(1.36,1.42,y))*smoothstep(0.06,0.12,ax)*(1.0-smoothstep(0.19,0.25,ax))*(1.0-smoothstep(-0.02,0.04,z));
                if (i==3) return smoothstep(1.22,1.28,y)*(1.0-smoothstep(1.54,1.60,y))*(1.0-smoothstep(0.13,0.19,ax))*(1.0-smoothstep(-0.03,0.02,z));
                if (i==4) return smoothstep(1.33,1.38,y)*(1.0-smoothstep(1.47,1.52,y))*smoothstep(0.16,0.20,ax)*(1.0-smoothstep(0.26,0.31,ax))*smoothstep(0.00,0.05,z);
                if (i==5) return smoothstep(1.33,1.38,y)*(1.0-smoothstep(1.48,1.53,y))*smoothstep(0.20,0.24,ax)*(1.0-smoothstep(0.31,0.36,ax));
                if (i==6) return smoothstep(1.33,1.38,y)*(1.0-smoothstep(1.47,1.52,y))*smoothstep(0.16,0.20,ax)*(1.0-smoothstep(0.27,0.32,ax))*(1.0-smoothstep(-0.04,0.01,z));
                if (i==7) return smoothstep(1.11,1.16,y)*(1.0-smoothstep(1.33,1.38,y))*smoothstep(0.22,0.26,ax)*(1.0-smoothstep(0.38,0.44,ax))*smoothstep(-0.02,0.03,z);
                if (i==8) return smoothstep(1.11,1.16,y)*(1.0-smoothstep(1.34,1.39,y))*smoothstep(0.22,0.26,ax)*(1.0-smoothstep(0.38,0.44,ax))*(1.0-smoothstep(-0.06,-0.01,z));
                if (i==9) return smoothstep(0.86,0.92,y)*(1.0-smoothstep(1.11,1.15,y))*smoothstep(0.30,0.35,ax)*(1.0-smoothstep(0.54,0.60,ax));
                if (i==10) return smoothstep(0.52,0.58,y)*(1.0-smoothstep(0.88,0.94,y))*(1.0-smoothstep(0.21,0.26,ax))*smoothstep(-0.01,0.04,z);
                if (i==11) return smoothstep(0.51,0.57,y)*(1.0-smoothstep(0.82,0.88,y))*(1.0-smoothstep(0.20,0.25,ax))*(1.0-smoothstep(-0.05,0.00,z));
                if (i==12) return smoothstep(0.14,0.20,y)*(1.0-smoothstep(0.45,0.50,y))*(1.0-smoothstep(0.19,0.24,ax))*(1.0-smoothstep(-0.03,0.02,z));
                if (i==13) return smoothstep(0.92,0.98,y)*(1.0-smoothstep(1.17,1.22,y))*(1.0-smoothstep(0.13,0.18,ax))*smoothstep(0.03,0.08,z);
                return 0.0;
              }
            `)
            .replace('#include <color_fragment>', `
              #include <color_fragment>
              float luma = dot(diffuseColor.rgb, vec3(0.299,0.587,0.114));
              vec3 baseCol = mix(vec3(0.18,0.19,0.21), vec3(0.54,0.57,0.61), smoothstep(0.12,0.72,luma));
              float tendon = smoothstep(0.66,0.78,luma);
              baseCol = mix(baseCol, vec3(0.84,0.86,0.89), tendon);
              float pH = 0.0; float sH = 0.0;
              for (int i=0; i<14; i++) {
                float w = mWeight(i, vWPos);
                pH = max(pH, w * uPrimaryMask[i]);
                sH = max(sH, w * uSecondaryMask[i]);
              }
              pH *= (1.0 - tendon * 0.65); sH *= (1.0 - tendon * 0.65);
              float pulse = 0.90 + 0.10 * sin(uTime * 3.2);
              vec3 c = mix(baseCol * 0.62, baseCol, max(clamp(pH+sH,0.0,1.0), 0.38));
              c = mix(c, vec3(0.76,0.44,0.09), sH * 0.90);
              c = mix(c, vec3(0.78,0.11,0.14) * pulse, pH * 0.94);
              diffuseColor.rgb = c;
            `);
        };
        child.material.needsUpdate = true;
      }
    });

    proceduralGroup.visible = false;
    scene.add(loadedGlbGroup);
    document.getElementById('model-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>${fileName} (Cached)`;
    update3DHighlights();
    if (!silent) showToast(`Loaded & cached ${fileName} permanently!`);
  });
}

async function autoRestoreGlb() {
  const cached = await getCachedGlb();
  if (cached && cached.buffer) {
    await mountGlbBuffer(cached.buffer, cached.name || DEFAULT_GLB_NAME, true);
    return;
  }
  try {
    const res = await fetch(`./${DEFAULT_GLB_NAME}`);
    if (res.ok) {
      const buf = await res.arrayBuffer();
      await saveGlbToCache(DEFAULT_GLB_NAME, buf);
      await mountGlbBuffer(buf, DEFAULT_GLB_NAME, true);
    }
  } catch (e) {}
}

function createStriationTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#686f78';
  ctx.fillRect(0, 0, 256, 256);

  for (let y = 0; y < 256; y += 2) {
    const shade = 112 + Math.sin(y * 0.45) * 26 + (Math.random() * 14 - 7);
    const v = Math.max(55, Math.min(185, Math.round(shade)));
    ctx.fillStyle = `rgb(${v}, ${v + 2}, ${v + 5})`;
    ctx.fillRect(0, y, 256, 1.5);
  }
  ctx.strokeStyle = 'rgba(226, 232, 240, 0.14)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 18; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * 14);
    ctx.bezierCurveTo(85, i * 14 + 5, 170, i * 14 - 5, 256, i * 14);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}

function makeMuscleMat(muscleKey) {

    roughness: 0.46,

  if (!muscleMaterials[muscleKey]) muscleMaterials[muscleKey] = [];
  muscleMaterials[muscleKey].push(mat);
  return mat;
}

  });
}

const camState = {
  theta: -2.55,
  phi: 1.44,
  radius: 2.55,
  target: new THREE.Vector3(0, 0.95, 0),
  desiredTheta: null,
  desiredPhi: null,
  desiredRadius: null,
  desiredTarget: null,
  autoRotate: false
};

function updateCameraFromSpherical() {
  camState.phi = Math.max(0.25, Math.min(Math.PI - 0.15, camState.phi));
  camState.radius = Math.max(0.85, Math.min(4.8, camState.radius));
  const sinPhi = Math.sin(camState.phi);
  camera.position.set(
    camState.target.x + camState.radius * sinPhi * Math.sin(camState.theta),
    camState.target.y + camState.radius * Math.cos(camState.phi),
    camState.target.z + camState.radius * sinPhi * Math.cos(camState.theta)
  );
  camera.lookAt(camState.target);
}
updateCameraFromSpherical();

function flyToAngle(angleKey) {
  const presets = {
    front: { theta: 0.0,   phi: 1.46, radius: 2.45, target: [0, 0.96, 0] },
    back:  { theta: Math.PI, phi: 1.46, radius: 2.45, target: [0, 0.96, 0] },
    side:  { theta: 1.15,  phi: 1.42, radius: 2.25, target: [0, 1.02, 0] },
    '34':  { theta: 0.58,  phi: 1.42, radius: 2.40, target: [0, 0.96, 0] }
  };
  const p = presets[angleKey] || presets.front;
  let diff = (p.theta - camState.theta) % (Math.PI * 2);
  if (diff > Math.PI) diff -= Math.PI * 2;
  if (diff < -Math.PI) diff += Math.PI * 2;
  camState.desiredTheta = camState.theta + diff;
  camState.desiredPhi = p.phi;
  camState.desiredRadius = p.radius;
  camState.desiredTarget = new THREE.Vector3(...p.target);
}

let isDragging = false;
let isPanning = false;
let prevPointer = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  isPanning = (e.button === 2 || e.shiftKey);
  prevPointer = { x: e.clientX, y: e.clientY };
  camState.desiredTheta = null;
});
window.addEventListener('pointerup', () => { isDragging = false; isPanning = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevPointer.x;
  const dy = e.clientY - prevPointer.y;
  prevPointer = { x: e.clientX, y: e.clientY };

  if (isPanning) {
    camState.target.y = Math.max(0.2, Math.min(1.7, camState.target.y + dy * 0.0022));
  } else {
    camState.theta -= dx * 0.0075;
    camState.phi -= dy * 0.0065;
  }
  updateCameraFromSpherical();
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camState.desiredTheta = null;
  camState.radius += e.deltaY * 0.0014;
  updateCameraFromSpherical();
}, { passive: false });

let activePrimarySet = new Set();
let activeSecondarySet = new Set();

function update3DHighlights() {
  const day = state.split[state.viewedDayIdx];
  const priArr = new Float32Array(14);
  const secArr = new Float32Array(14);
  activePrimarySet = new Set();
  activeSecondarySet = new Set();

  let statusText = '';
  if (state.selectedExIdx !== null && day.exercises[state.selectedExIdx]) {
    const ex = day.exercises[state.selectedExIdx];
    ex.primary.forEach((m) => {
      activePrimarySet.add(m);
      const idx = MUSCLE_KEYS.indexOf(m);
      if (idx >= 0) priArr[idx] = 1.0;
    });
    ex.secondary.forEach((m) => {
      if (!activePrimarySet.has(m)) {
        activeSecondarySet.add(m);
        const idx = MUSCLE_KEYS.indexOf(m);
        if (idx >= 0) secArr[idx] = 1.0;
      }
    });
    const priLabels = ex.primary.map((m) => MUSCLE_INFO[m]?.latin || m).join(', ');
    statusText = `${ex.name} • Primary: ${priLabels}`;
    flyToAngle(ex.angle || day.defaultAngle);
  } else {
    day.exercises.forEach((ex) => {
      ex.primary.forEach((m) => {
        activePrimarySet.add(m);
        const idx = MUSCLE_KEYS.indexOf(m);
        if (idx >= 0) priArr[idx] = 1.0;
      });
    });
    day.exercises.forEach((ex) => {
      ex.secondary.forEach((m) => {
        if (!activePrimarySet.has(m)) {
          activeSecondarySet.add(m);
          const idx = MUSCLE_KEYS.indexOf(m);
          if (idx >= 0) secArr[idx] = 1.0;
        }
      });
    });
    const summaryLabels = Array.from(activePrimarySet).map((m) => MUSCLE_INFO[m]?.short || m).join(', ');
    statusText = `${day.name} • ${summaryLabels}`;
    flyToAngle(day.defaultAngle);
  }

  glbUniforms.uPrimaryMask.value = priArr;
  glbUniforms.uSecondaryMask.value = secArr;
  document.getElementById('status-banner').textContent = statusText;
}

function parseRestSeconds(metaStr) {
  if (!metaStr) return 90;
  const minMatch = metaStr.match(/Rest:\s*([\d.]+)\s*m/i);
  if (minMatch) return Math.round(parseFloat(minMatch[1]) * 60);
  const secMatch = metaStr.match(/Rest:\s*(\d+)\s*s/i);
  if (secMatch) return parseInt(secMatch[1], 10);
  return 90;
}

  list.innerHTML = '';

  day.exercises.forEach((ex, idx) => {
    const isSelected = state.selectedExIdx === idx;
    const card = document.createElement('div');
    card.className = `ex-card rounded-xl border border-slate-200 bg-white p-3 cursor-pointer ${isSelected ? 'active' : ''}`;

    const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' proper form')}`;
    const bestSet = (ex.sets || []).reduce((best, s) => (Number(s.w) > best.w ? { w: Number(s.w), r: Number(s.r) } : best), { w: 0, r: 0 });
    const targetBadge = bestSet.w > 0 ? `PR / Beat: ${bestSet.w} kg × ${bestSet.r}` : `Target: ${ex.target || 'Set Baseline'}`;

    const setsHtml = (ex.sets || []).map((s, sIdx) => `
      <div class="flex items-center gap-1 text-[11px] ${s.done ? 'bg-emerald-50/90 border-emerald-300' : 'bg-slate-50 border-slate-200/80'} border rounded-lg px-2 py-1.5 transition">
        <button data-ex="${idx}" data-set="${sIdx}" class="done-set-btn w-6 h-6 rounded-md flex items-center justify-center font-extrabold text-xs shrink-0 transition ${
          s.done ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-300 text-slate-400 hover:border-emerald-500'
        }" title="Mark set done & start rest timer">✓</button>
        <span class="font-bold text-slate-500 w-7 text-[10px]">S${sIdx + 1}</span>
        <div class="flex items-center bg-white border border-slate-300 rounded overflow-hidden">
          <button type="button" data-ex="${idx}" data-set="${sIdx}" data-field="w" data-delta="-2.5" class="step-btn px-1.5 py-1 text-slate-600 hover:bg-slate-100 active:bg-slate-200 font-bold">−</button>
          <input type="number" step="0.5" value="${s.w}" data-ex="${idx}" data-set="${sIdx}" data-field="w"
            class="set-input w-11 text-center font-bold text-slate-900 bg-white py-0.5 focus:outline-none" />
          <button type="button" data-ex="${idx}" data-set="${sIdx}" data-field="w" data-delta="2.5" class="step-btn px-1.5 py-1 text-slate-600 hover:bg-slate-100 active:bg-slate-200 font-bold">+</button>
        </div>
        <span class="text-slate-400 font-semibold text-[10px]">kg</span>
        <div class="flex items-center bg-white border border-slate-300 rounded overflow-hidden">
          <button type="button" data-ex="${idx}" data-set="${sIdx}" data-field="r" data-delta="-1" class="step-btn px-1.5 py-1 text-slate-600 hover:bg-slate-100 active:bg-slate-200 font-bold">−</button>
          <input type="number" step="1" value="${s.r}" data-ex="${idx}" data-set="${sIdx}" data-field="r"
            class="set-input w-8 text-center font-bold text-slate-900 bg-white py-0.5 focus:outline-none" />
          <button type="button" data-ex="${idx}" data-set="${sIdx}" data-field="r" data-delta="1" class="step-btn px-1.5 py-1 text-slate-600 hover:bg-slate-100 active:bg-slate-200 font-bold">+</button>
        </div>
        <span class="text-slate-400 font-semibold text-[10px]">r</span>
        <button data-ex="${idx}" data-set="${sIdx}" class="del-set-btn ml-auto text-slate-400 hover:text-rose-600 font-bold px-1.5 py-0.5" title="Remove set">✕</button>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="flex items-start justify-between gap-2">
        <div class="text-[13px] font-extrabold text-slate-900 leading-snug">${idx + 1}. ${ex.name}</div>
        <span class="text-[11px] font-bold text-blue-600 whitespace-nowrap">${ex.meta}</span>
      </div>
      <p class="text-[11.5px] text-slate-500 mt-0.5 leading-snug">${ex.cue}</p>

      <!-- Primary & Secondary Muscle Chips + Form / Swap Actions -->
      <div class="flex flex-wrap items-center gap-1 mt-2">
        ${ex.primary.map(m => `<span class="text-[9.5px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-red-100 text-red-800">${MUSCLE_INFO[m]?.short || m}</span>`).join('')}
        ${ex.secondary.map(m => `<span class="text-[9.5px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-amber-100 text-amber-900">${MUSCLE_INFO[m]?.short || m}</span>`).join('')}
        <div class="ml-auto flex items-center gap-1">
          <a href="${ytUrl}" target="_blank" rel="noopener" class="text-[10.5px] font-semibold px-2 py-0.5 rounded border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600">
            Form ↗
          </a>
          <button data-idx="${idx}" class="swap-btn text-[10.5px] font-semibold px-2 py-0.5 rounded border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700">
            Swap
          </button>
        </div>
      </div>

      <!-- Set / Weight (kg) / Reps Logger -->
      <div class="mt-2.5 pt-2 border-t border-slate-100 space-y-1.5 logger-zone">
        <div class="flex items-center justify-between text-[10.5px]">
          <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">${targetBadge}</span>
          <button data-ex="${idx}" class="add-set-btn font-bold text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded hover:bg-blue-50">
            + Add Set
          </button>
        </div>
        <div class="space-y-1.5">
          ${setsHtml}
        </div>
      </div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('button') || e.target.closest('input')) return;
      state.selectedExIdx = state.selectedExIdx === idx ? null : idx;
      saveState();
      renderInspector(true);
      update3DHighlights();
    });

    card.querySelectorAll('.set-input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const eIdx = Number(e.target.dataset.ex);
        const sIdx = Number(e.target.dataset.set);
        const field = e.target.dataset.field;
        day.exercises[eIdx].sets[sIdx][field] = Number(e.target.value) || 0;
        saveState();
        const best = (day.exercises[eIdx].sets || []).reduce(
          (b, s) => (Number(s.w) > b.w ? { w: Number(s.w), r: Number(s.r) } : b),
          { w: 0, r: 0 }
        );
        const prLabel = card.querySelector('.logger-zone span');
        if (prLabel) {
          prLabel.textContent = best.w > 0 ? `PR / Beat: ${best.w} kg × ${best.r}` : `Target: ${day.exercises[eIdx].target || 'Set Baseline'}`;
        }
      });
    });

    // Thumb Stepper Buttons (- / +)
    card.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const eIdx = Number(btn.dataset.ex);
        const sIdx = Number(btn.dataset.set);
        const field = btn.dataset.field;
        const delta = Number(btn.dataset.delta);
        const curr = Number(day.exercises[eIdx].sets[sIdx][field]) || 0;
        const next = Math.max(0, Math.round((curr + delta) * 10) / 10);
        day.exercises[eIdx].sets[sIdx][field] = next;
        saveState();
        renderInspector(true);
      });
    });

    // Done Set Checkmark -> Starts Rest Countdown Timer
    card.querySelectorAll('.done-set-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const eIdx = Number(btn.dataset.ex);
        const sIdx = Number(btn.dataset.set);
        const setObj = day.exercises[eIdx].sets[sIdx];
        setObj.done = !setObj.done;
        saveState();
        renderInspector(true);
        if (setObj.done) {
          startRestTimer(parseRestSeconds(day.exercises[eIdx].meta));
        }
      });
    });

    card.querySelector('.add-set-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const eIdx = Number(e.target.dataset.ex);
      const prev = day.exercises[eIdx].sets;
      const last = prev[prev.length - 1] || { w: 15, r: 10 };
      prev.push({ w: last.w, r: last.r, done: false });
      saveState();
      renderInspector(true);
      showToast('Added set to ' + day.exercises[eIdx].name);
    });

    card.querySelectorAll('.del-set-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const eIdx = Number(e.target.dataset.ex);
        const sIdx = Number(e.target.dataset.set);
        if (day.exercises[eIdx].sets.length > 1) {
          day.exercises[eIdx].sets.splice(sIdx, 1);
          saveState();
          renderInspector(true);
        }
      });
    });

    card.querySelector('.swap-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      swappingIdx = idx;
      document.getElementById('swap-name').value = ex.name;
      document.getElementById('swap-meta').value = ex.meta;
      document.getElementById('swap-cue').value = ex.cue;
      document.getElementById('swap-primary').value = ex.primary[0] || 'chest';
      const modal = document.getElementById('swap-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    list.appendChild(card);
  });

  if (preserveScroll) {
    list.scrollTop = savedScrollTop;
  } else {
    list.scrollTop = 0;
  }
}

// ============================================================================
// 7. ROLLING QUEUE, POSTPONE, SWAP MODAL & TOOLBAR CONTROLS
// ============================================================================
document.getElementById('btn-scroll-top').addEventListener('click', () => {
  const list = document.getElementById('exercise-list');
  if (list) list.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('btn-highlight-day').addEventListener('click', () => {
  state.selectedExIdx = null;
  saveState();
  renderInspector(true);
  update3DHighlights();
});

document.getElementById('btn-postpone').addEventListener('click', () => {
  state.postponedDays += 1;
  saveState();
  renderInspector(true);
  const queuedName = state.split[state.queuedDayIdx].name;
  showToast(`Rest day logged! ${queuedName} stays queued next without skipping.`);
});

document.getElementById('btn-complete').addEventListener('click', () => {
  const finishedDay = state.split[state.queuedDayIdx];
  const finishedName = finishedDay.name;
  finishedDay.exercises.forEach(ex => (ex.sets || []).forEach(s => { s.done = false; }));
  stopRestTimer();
  state.queuedDayIdx = (state.queuedDayIdx + 1) % state.split.length;
  state.viewedDayIdx = state.queuedDayIdx;
  state.selectedExIdx = null;
  saveState();
  renderInspector(false);
  update3DHighlights();
  showToast(`Completed ${finishedName} → Advanced to ${state.split[state.queuedDayIdx].name}`);
});

function buildSyncSummary() {
  const day = state.split[state.viewedDayIdx];
  const loggedLines = day.exercises.map(ex => {
    const setsStr = (ex.sets || []).map(s => `${s.w}kg×${s.r}`).join(', ');
    return `${ex.name}: [${setsStr}]`;
  }).join(' | ');
  return `J.A.R.V.I.S. Sync | Queued Next: ${state.split[state.queuedDayIdx].name} | Rest Paused: ${state.postponedDays} | Viewed (${day.name}): ${loggedLines}`;
}

document.getElementById('btn-copy-sync').addEventListener('click', () => {
  const summary = buildSyncSummary();
  const ta = document.createElement('textarea');
  ta.value = summary;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  showToast('Copied workout & set/weight sync string to clipboard!');
});

function closeSwapModal() {
  const modal = document.getElementById('swap-modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}
document.getElementById('swap-close-x').addEventListener('click', closeSwapModal);
document.getElementById('swap-cancel').addEventListener('click', closeSwapModal);

document.getElementById('swap-save').addEventListener('click', () => {
  if (swappingIdx === null) return;
  const day = state.split[state.viewedDayIdx];
  const newName = document.getElementById('swap-name').value.trim();
  const newMeta = document.getElementById('swap-meta').value.trim();
  const newCue = document.getElementById('swap-cue').value.trim();
  const newPri = document.getElementById('swap-primary').value;
  if (newName) {
    const existingSets = day.exercises[swappingIdx].sets || [{ w: 15, r: 10 }, { w: 15, r: 10 }, { w: 15, r: 10 }];
    day.exercises[swappingIdx] = {
      name: newName,
      meta: newMeta || '3 × 10–12 | Rest: 75s',
      cue: newCue || 'Controlled eccentric, full range of motion.',
      primary: [newPri],
      secondary: [],
      angle: ['lats', 'upper_back', 'rear_delts', 'hamstrings', 'calves'].includes(newPri) ? 'back' : 'front',
      sets: existingSets
    };
    saveState();
    renderInspector();
    update3DHighlights();
    showToast(`Swapped permanently to ${newName}`);
  }
  closeSwapModal();
});

document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(handleResize, 260);
});
document.getElementById('btn-view-front').addEventListener('click', () => flyToAngle('front'));
document.getElementById('btn-view-back').addEventListener('click', () => flyToAngle('back'));
document.getElementById('btn-view-34').addEventListener('click', () => flyToAngle('34'));
document.getElementById('btn-reset-cam').addEventListener('click', () => flyToAngle(state.split[state.viewedDayIdx].defaultAngle));
document.getElementById('btn-auto-rotate').addEventListener('click', (e) => {
  camState.autoRotate = !camState.autoRotate;
  e.target.classList.toggle('bg-blue-600', camState.autoRotate);
  e.target.classList.toggle('text-white', camState.autoRotate);
  showToast(`360° Auto-Rotate: ${camState.autoRotate ? 'ON' : 'OFF'}`);
});

// 8. J.A.R.V.I.S. GEMINI LIVE COMMAND BAR
// ============================================================================
const jarvisDrawer = document.getElementById('jarvis-drawer');
const jarvisChevron = document.getElementById('jarvis-chevron');
document.getElementById('gemini-api-key').value = state.apiKey || '';

document.getElementById('btn-toggle-jarvis').addEventListener('click', () => {
  const isHidden = jarvisDrawer.classList.toggle('hidden');
  jarvisChevron.textContent = isHidden ? '▲ Expand' : '▼ Collapse';
});

document.getElementById('btn-save-key').addEventListener('click', () => {
  state.apiKey = document.getElementById('gemini-api-key').value.trim();
  saveState();
  showToast(state.apiKey ? 'Gemini API key saved locally!' : 'Cleared custom key (using built-in endpoint).');

document.querySelectorAll('.quick-cmd').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('jarvis-command-input').value = btn.dataset.cmd;
    runJarvisCommand();
  });
});

document.getElementById('btn-run-jarvis').addEventListener('click', runJarvisCommand);
document.getElementById('jarvis-command-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runJarvisCommand();
});

async function runJarvisCommand() {
  const inputEl = document.getElementById('jarvis-command-input');
  const respBox = document.getElementById('jarvis-response');
  const cmd = inputEl.value.trim();
  if (!cmd) return;

  respBox.classList.remove('hidden');
  respBox.textContent = 'J.A.R.V.I.S. processing command...';

  const day = state.split[state.viewedDayIdx];
  const selectedEx = state.selectedExIdx !== null ? day.exercises[state.selectedExIdx] : null;
  const apiKey = state.apiKey || '';
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

  const systemPrompt = `You are J.A.R.V.I.S., an intelligent hypertrophy & biomechanics assistant controlling a 6-day rolling workout app.
User constraints: NO push-ups, NO pull-ups, NO glute-focused leg compounds (no barbell squats/deadlifts/lunges). Focus on upper-body V-taper, arms, delts, and pure quad/hamstring hypertrophy.
Valid muscle keys: chest, upper_chest, lats, upper_back, front_delts, side_delts, rear_delts, biceps, triceps, forearms, quads, hamstrings, calves, abs.
Current Day Index: ${state.viewedDayIdx} (${day.name}).
Current Exercises: ${JSON.stringify(day.exercises.map((e, i) => ({ index: i, name: e.name, meta: e.meta, primary: e.primary })))}.
Selected Exercise: ${selectedEx ? JSON.stringify({ index: state.selectedExIdx, name: selectedEx.name }) : 'None'}.

Respond ONLY with valid JSON matching this schema:
{
  "action": "postpone" | "complete" | "swap" | "advice",
  "targetIndex": number,
  "newExercise": { "name": string, "meta": string, "cue": string, "primary": [string] },
  "reply": string
}`;

  const payload = {
    contents: [{ parts: [{ text: cmd }] }],
    systemInstruction: { parts: [{ text: systemPrompt }] },
    generationConfig: { responseMimeType: 'application/json' }
  };

  try {
    let resultData = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        resultData = await res.json();
        break;
      }
      await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
    }

    const rawText = resultData?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!rawText) throw new Error('Empty response');
    const parsed = JSON.parse(rawText);

    if (parsed.action === 'postpone') {
      state.postponedDays += 1;
    } else if (parsed.action === 'complete') {
      state.queuedDayIdx = (state.queuedDayIdx + 1) % state.split.length;
      state.viewedDayIdx = state.queuedDayIdx;
      state.selectedExIdx = null;
    } else if (parsed.action === 'swap' && parsed.newExercise && typeof parsed.targetIndex === 'number' && day.exercises[parsed.targetIndex]) {
      const validPrimary = (parsed.newExercise.primary || []).filter(k => MUSCLE_INFO[k]);
      const pKey = validPrimary[0] || day.exercises[parsed.targetIndex].primary[0];
      day.exercises[parsed.targetIndex] = {
        name: parsed.newExercise.name,
        meta: parsed.newExercise.meta || '3 × 10–12 | Rest: 75s',
        cue: parsed.newExercise.cue || 'Strict control, full hypertrophy stretch.',
        primary: validPrimary.length ? validPrimary : [pKey],
        secondary: [],
        angle: ['lats', 'upper_back', 'rear_delts', 'hamstrings', 'calves'].includes(pKey) ? 'back' : 'front',
        sets: day.exercises[parsed.targetIndex].sets
      };
    }

    saveState();
    renderInspector();
    update3DHighlights();
    respBox.textContent = parsed.reply || 'Command executed.';
    inputEl.value = '';
  } catch (err) {
    const lower = cmd.toLowerCase();
    if (lower.includes('postpone') || lower.includes('rest')) {
      state.postponedDays += 1;
      saveState();
      renderInspector();
      respBox.textContent = `Rest day logged locally. ${state.split[state.queuedDayIdx].name} remains queued next without skipping.`;
    } else if (lower.includes('complete') || lower.includes('done') || lower.includes('next')) {
      state.queuedDayIdx = (state.queuedDayIdx + 1) % state.split.length;
      state.viewedDayIdx = state.queuedDayIdx;
      state.selectedExIdx = null;
      saveState();
      renderInspector();
      update3DHighlights();
      respBox.textContent = `Advanced rolling queue to ${state.split[state.queuedDayIdx].name}.`;
    } else {
      respBox.textContent = 'Tip: Click "Swap" on any exercise card to edit it directly, or paste a Gemini API key above for live AI exercise substitutions.';
    }
  }
}

// ============================================================================
// 9. ANIMATION LOOP, RESPONSIVE RESIZE & UNIFIED STARTUP
// ============================================================================
function handleResize() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}
window.addEventListener('resize', handleResize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  glbUniforms.uTime.value = t;

  if (camState.desiredTheta !== null) {
    camState.theta += (camState.desiredTheta - camState.theta) * 0.09;
    camState.phi += (camState.desiredPhi - camState.phi) * 0.09;
    camState.radius += (camState.desiredRadius - camState.radius) * 0.09;
    camState.target.lerp(camState.desiredTarget, 0.09);
    updateCameraFromSpherical();
    if (Math.abs(camState.desiredTheta - camState.theta) < 0.005) {
      camState.desiredTheta = null;
    }
  } else if (camState.autoRotate && !isDragging) {
    camState.theta += 0.006;
    updateCameraFromSpherical();
  }

  const pulse = 0.85 + 0.15 * Math.sin(t * 3.4);
  const hasAnyHighlight = activePrimarySet.size > 0 || activeSecondarySet.size > 0;

  Object.entries(muscleMaterials).forEach(([key, mats]) => {
    const isPrimary = activePrimarySet.has(key);
    const isSecondary = activeSecondarySet.has(key);

    mats.forEach(mat => {
      if (isPrimary) {
        mat.color.setHex(0xc81e2b);
        mat.emissive.setHex(0x88131b);
        mat.emissiveIntensity = 0.36 * pulse;
      } else if (isSecondary) {
        mat.color.setHex(0xc67d1b);
        mat.emissive.setHex(0x854d0e);
        mat.emissiveIntensity = 0.22;
      } else {
        mat.color.setHex(hasAnyHighlight ? 0x5c626b : 0x737a84);
        mat.emissive.setHex(0x000000);
        mat.emissiveIntensity = 0;
      }
    });
  });

  renderer.render(scene, camera);
}

window.addEventListener('load', () => {
  renderInspector();
  update3DHighlights();
  autoRestoreGlb();
  animate();
  pullCloudSync();
});
